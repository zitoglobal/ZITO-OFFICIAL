# ZITO Official — canonical https://www.zitoglobal.com/
# Cert: /etc/letsencrypt/live/www.zitoglobal.com (SANs: www + apex)

# —— HTTP: www → HTTPS www ——
server {
    listen 80;
    listen [::]:80;
    server_name www.zitoglobal.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://www.zitoglobal.com$request_uri;
    }
}

# —— HTTP: apex → HTTPS www ——
server {
    listen 80;
    listen [::]:80;
    server_name zitoglobal.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://www.zitoglobal.com$request_uri;
    }
}

# —— HTTPS: apex → www ——
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name zitoglobal.com;

    ssl_certificate /etc/letsencrypt/live/www.zitoglobal.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.zitoglobal.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    return 301 https://www.zitoglobal.com$request_uri;
}

# —— HTTPS: www (primary) ——
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.zitoglobal.com;

    root /var/www/zito-official;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/www.zitoglobal.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.zitoglobal.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
