# Temporary HTTP vhost used until the certificate exists.
server {
    listen 80;
    listen [::]:80;
    server_name zitoglobal.com www.zitoglobal.com;

    root /var/www/zito-official;
    index index.html;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
